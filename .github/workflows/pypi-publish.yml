name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish Python Package to PyPI
    runs-on: ubuntu-latest
    environment: my-python

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Audio Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sox libsox-fmt-all mpg123 alsa-utils

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Run Unit Tests
        run: |
          python test_talking_clock.py --unit

      - name: Build Source Distribution and Wheel
        run: |
          python -m build

      - name: Verify Package Metadata with Twine
        run: |
          twine check dist/*

      - name: Publish Package to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME || vars.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          twine upload --skip-existing dist/*
